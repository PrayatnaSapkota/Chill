<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<title>Sandhya Bhattarai — Coming Soon</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap"
    rel="stylesheet"
>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {

    min-height: 100svh;

    font-family: "DM Sans", sans-serif;

    color: #29242f;

    /*
       LIGHTWEIGHT BACKGROUND

       Only one static gradient layer.
       No giant blur.
       No multiple animated radial gradients.
    */

    background:
        linear-gradient(
            135deg,
            #fbf8fc 0%,
            #f8f4fc 42%,
            #f7f7fc 70%,
            #faf8fc 100%
        );

    overflow: hidden;

    position: relative;
}


/* =========================================================
   LIGHTWEIGHT COSMIC GLOW
========================================================= */

/*
   Small fixed glow instead of a huge blurred full-screen
   element.
*/

body::before {

    content: "";

    position: fixed;

    width: 420px;
    height: 420px;

    left: 50%;
    top: 45%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(197, 168, 235, .15) 0%,
            rgba(197, 168, 235, .06) 35%,
            transparent 70%
        );

    pointer-events: none;

    z-index: 0;
}


/* =========================================================
   STARS
========================================================= */

/*
   Lightweight star field.

   Instead of many DOM elements,
   CSS creates a small repeating pattern.
*/

.space {

    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: 1;

    overflow: hidden;
}

.stars {

    position: absolute;

    inset: 0;

    background-image:

        radial-gradient(
            circle,
            rgba(94, 76, 120, .48) 1px,
            transparent 1.3px
        ),

        radial-gradient(
            circle,
            rgba(130, 104, 155, .30) 1px,
            transparent 1.3px
        );

    background-size:
        145px 145px,
        225px 225px;

    background-position:
        15px 25px,
        70px 90px;

    opacity: .38;
}


/* =========================================================
   SHOOTING STAR
========================================================= */

.shooting-star {

    position: absolute;

    width: 90px;
    height: 1px;

    top: 18%;
    left: -120px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(130, 104, 165, .18),
            rgba(130, 104, 165, .78)
        );

    transform: rotate(-32deg);

    opacity: 0;

    animation:
        shootingStar
        11s
        linear
        infinite;
}

.shooting-star::after {

    content: "";

    position: absolute;

    right: 0;
    top: -2px;

    width: 4px;
    height: 4px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 8px rgba(150, 120, 200, .75);
}

@keyframes shootingStar {

    0%,
    74% {

        transform:
            translate(0, 0)
            rotate(-32deg);

        opacity: 0;
    }

    77% {
        opacity: 1;
    }

    87% {

        transform:
            translate(115vw, 55vh)
            rotate(-32deg);

        opacity: 0;
    }

    100% {
        opacity: 0;
    }
}


/* =========================================================
   MAIN
========================================================= */

main {

    position: relative;

    z-index: 5;

    min-height: 100svh;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding:
        40px 24px
        max(40px, env(safe-area-inset-bottom));
}

.content {

    width: min(900px, 100%);

    display: flex;

    flex-direction: column;

    align-items: center;
}


/* =========================================================
   NAME
========================================================= */

.name-wrap {

    position: relative;

    margin-bottom: 22px;

    padding: 5px 12px;

    overflow: visible;
}

.name {

    position: relative;

    font-family: "Manrope", sans-serif;

    font-size:
        clamp(2rem, 5vw, 4.2rem);

    font-weight: 600;

    line-height: 1.1;

    letter-spacing: -.045em;

    /*
       COSMIC GRADIENT INSIDE NAME
    */

    background:
        linear-gradient(
            110deg,
            #4a385b 0%,
            #9366b8 20%,
            #d18caf 38%,
            #9a76d0 52%,
            #6e88c8 68%,
            #c784ae 82%,
            #4a385b 100%
        );

    background-size: 300% 100%;

    background-position: 0% 50%;

    -webkit-background-clip: text;
    background-clip: text;

    -webkit-text-fill-color: transparent;

    color: transparent;

    opacity: 0;

    transform:
        translateY(18px);

    animation:

        nameReveal
        1s
        cubic-bezier(.16,1,.3,1)
        .15s
        forwards,

        nameGradient
        6s
        ease-in-out
        1.2s
        infinite;
}


/* Name entrance */

@keyframes nameReveal {

    to {

        opacity: 1;

        transform:
            translateY(0);
    }
}


/* Name color movement */

@keyframes nameGradient {

    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }
}


/* =========================================================
   NAME LIGHT SWEEP
========================================================= */

.name-wrap::after {

    content: "";

    position: absolute;

    top: 0;
    bottom: 0;

    width: 65px;

    left: -100px;

    transform:
        skewX(-18deg);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.60),
            transparent
        );

    pointer-events: none;

    animation:
        nameSweep
        6s
        ease-in-out
        2s
        infinite;
}

@keyframes nameSweep {

    0%,
    32% {

        left: -100px;

        opacity: 0;
    }

    42% {
        opacity: .75;
    }

    57% {

        left:
            calc(100% + 40px);

        opacity: 0;
    }

    100% {

        left:
            calc(100% + 40px);

        opacity: 0;
    }
}


/* =========================================================
   ORBIT
========================================================= */

.orbit {

    position: absolute;

    width:
        min(520px, 72vw);

    aspect-ratio: 2 / 1;

    border:
        1px solid
        rgba(135, 110, 165, .15);

    border-radius: 50%;

    pointer-events: none;

    opacity: 0;

    animation:
        orbitAppear
        1.1s
        ease
        1s
        forwards,

        orbitRotate
        24s
        linear
        1.5s
        infinite;
}

.orbit::before,
.orbit::after {

    content: "";

    position: absolute;

    top: 50%;

    width: 6px;
    height: 6px;

    border-radius: 50%;

    transform:
        translateY(-50%);
}

.orbit::before {

    left: -3px;

    background: #b18ad5;

    box-shadow:
        0 0 10px
        rgba(177,138,213,.65);
}

.orbit::after {

    right: -3px;

    background: #d99dbd;

    box-shadow:
        0 0 10px
        rgba(217,157,189,.55);
}

@keyframes orbitAppear {

    from {

        opacity: 0;

        transform:
            rotate(-18deg)
            scale(.92);
    }

    to {

        opacity: 1;

        transform:
            rotate(-18deg)
            scale(1);
    }
}

@keyframes orbitRotate {

    from {
        transform: rotate(-18deg);
    }

    to {
        transform: rotate(342deg);
    }
}


/* =========================================================
   COMING SOON
========================================================= */

.coming {

    position: relative;

    font-family: "Manrope", sans-serif;

    font-size:
        clamp(2.6rem, 8vw, 6.8rem);

    line-height: .95;

    font-weight: 700;

    letter-spacing: -.065em;

    color: #201a28;

    opacity: 0;

    transform:
        scale(.95)
        translateY(12px);

    animation:
        comingReveal
        1.1s
        cubic-bezier(.16,1,.3,1)
        .45s
        forwards;
}


/*
   Small glow behind COMING SOON.

   No huge blur.
*/

.coming::before {

    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 110%;
    height: 150%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse,
            rgba(178,143,224,.13),
            transparent 68%
        );

    z-index: -1;
}

@keyframes comingReveal {

    0% {

        opacity: 0;

        transform:
            scale(.95)
            translateY(12px);

        letter-spacing:
            -.085em;
    }

    100% {

        opacity: 1;

        transform:
            scale(1)
            translateY(0);

        letter-spacing:
            -.065em;
    }
}


/* =========================================================
   DESCRIPTION
========================================================= */

.description {

    margin-top: 25px;

    font-size:
        clamp(.92rem, 2vw, 1.05rem);

    color: #756d7d;

    letter-spacing: .01em;

    opacity: 0;

    transform:
        translateY(10px);

    animation:
        fadeUp
        .8s
        ease
        1s
        forwards;
}


/* =========================================================
   BUTTONS
========================================================= */

.links {

    display: flex;

    gap: 12px;

    margin-top: 32px;

    opacity: 0;

    transform:
        translateY(10px);

    animation:
        fadeUp
        .8s
        ease
        1.25s
        forwards;
}

.link {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    gap: 9px;

    min-width: 130px;

    min-height: 46px;

    padding:
        11px 20px;

    border-radius: 999px;

    text-decoration: none;

    font-size: .88rem;

    font-weight: 500;

    backdrop-filter: blur(8px);

    -webkit-backdrop-filter: blur(8px);

    transition:
        transform .25s ease,
        background .25s ease,
        box-shadow .25s ease;
}


/* =========================================================
   INSTAGRAM
========================================================= */

.link.instagram {

    color: #a34b82;

    background:
        linear-gradient(
            135deg,
            rgba(255,205,226,.48),
            rgba(221,190,255,.40)
        );

    border:
        1px solid
        rgba(190,105,157,.23);
}

.link.instagram:hover {

    color: #8e356d;

    background:
        linear-gradient(
            135deg,
            rgba(255,190,218,.65),
            rgba(210,174,250,.58)
        );

    box-shadow:
        0 8px 22px
        rgba(190,105,157,.15);

    transform:
        translateY(-2px);
}


/* =========================================================
   EMAIL
========================================================= */

.link.email {

    color: #5576a8;

    background:
        linear-gradient(
            135deg,
            rgba(204,222,255,.50),
            rgba(224,210,255,.40)
        );

    border:
        1px solid
        rgba(100,130,190,.23);
}

.link.email:hover {

    color: #426496;

    background:
        linear-gradient(
            135deg,
            rgba(190,216,255,.66),
            rgba(215,198,255,.58)
        );

    box-shadow:
        0 8px 22px
        rgba(92,125,185,.14);

    transform:
        translateY(-2px);
}


/* =========================================================
   ICONS
========================================================= */

.link svg {

    width: 17px;
    height: 17px;

    flex-shrink: 0;
}

.instagram-icon {

    fill: currentColor;

    stroke: none;
}

.email-icon {

    fill: none;

    stroke: currentColor;
}


/* =========================================================
   FADE
========================================================= */

@keyframes fadeUp {

    to {

        opacity: 1;

        transform:
            translateY(0);
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    /*
       Remove most background effects on mobile.

       The page stays visually similar,
       but the phone has much less to render.
    */

    body::before {

        width: 300px;
        height: 300px;

        opacity: .65;
    }

    .stars {

        opacity: .25;

        background-size:
            170px 170px,
            260px 260px;
    }

    .shooting-star {

        display: none;
    }

    main {

        padding-left: 18px;
        padding-right: 18px;
    }

    .name {

        font-size:
            clamp(
                1.85rem,
                8.8vw,
                3.2rem
            );
    }

    .name-wrap {

        margin-bottom: 18px;
    }

    .coming {

        font-size:
            clamp(
                2.5rem,
                13vw,
                4.2rem
            );
    }

    .description {

        max-width: 300px;

        line-height: 1.5;
    }

    .orbit {

        width: 92vw;
    }

    .links {

        width: 100%;

        max-width: 310px;

        gap: 9px;
    }

    .link {

        flex: 1;

        min-width: 0;

        padding:
            10px 15px;
    }
}


/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media (max-width: 380px) {

    body::before {

        width: 240px;
        height: 240px;
    }

    .stars {

        opacity: .18;
    }

    .name {

        font-size:
            1.7rem;
    }

    .coming {

        font-size:
            2.35rem;
    }

    .description {

        font-size:
            .84rem;
    }

    .links {

        margin-top: 26px;
    }

    .link {

        min-height: 44px;

        padding:
            9px 12px;

        font-size:
            .80rem;
    }

    .link svg {

        width: 16px;
        height: 16px;
    }

    .orbit {

        width: 105vw;
    }
}


/* =========================================================
   SHORT SCREENS
========================================================= */

@media (max-height: 700px) {

    main {

        padding-top: 25px;
        padding-bottom: 25px;
    }

    .name-wrap {

        margin-bottom: 13px;
    }

    .description {

        margin-top: 17px;
    }

    .links {

        margin-top: 22px;
    }

    .orbit {

        width:
            min(430px, 72vw);
    }
}


/* =========================================================
   LANDSCAPE PHONE
========================================================= */

@media (orientation: landscape) and (max-height: 500px) {

    body {

        overflow-y: auto;
    }

    .shooting-star {

        display: none;
    }

    main {

        min-height: 100svh;

        padding-top: 35px;
        padding-bottom: 35px;
    }

    .name {

        font-size: 2rem;
    }

    .coming {

        font-size: 3.3rem;
    }

    .description {

        margin-top: 13px;
    }

    .links {

        margin-top: 18px;
    }

    .orbit {

        width: 360px;
    }
}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {

        animation-duration:
            .01ms !important;

        animation-iteration-count:
            1 !important;
    }
}

</style>
</head>


<body>


<!-- =======================================================
     BACKGROUND
======================================================= -->

<div class="space">

    <div class="stars"></div>

    <div class="shooting-star"></div>

</div>


<!-- =======================================================
     CONTENT
======================================================= -->

<main>

    <div class="content">


        <!-- NAME -->

        <div class="name-wrap">

            <h1 class="name">
                Sandhya Bhattarai
            </h1>

        </div>


        <!-- ORBIT -->

        <div class="orbit"></div>


        <!-- TITLE -->

        <div class="coming">

        </div>

        <p class="description">

        <!-- LINKS -->

        <div class="links">


            <!-- INSTAGRAM -->

            <a

                href="https://instagram.com/sandhyaa_bhattarai06"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Visit Sandhya Bhattarai on Instagram"
            >

                <svg

                >

        </div>

    </div>

</main>


</body>
</html>
