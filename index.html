```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sandhya Bhattarai — In Progress</title>

    <meta name="description"
        content="The personal portfolio of Sandhya Bhattarai is currently being developed.">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #050505;
            --text: #f4f4f4;
            --muted: #777;
            --line: rgba(255,255,255,0.09);
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            overflow: hidden;
        }

        /* -------------------------
           AMBIENT LIGHT
        ------------------------- */

        .glow {
            position: fixed;
            width: 650px;
            height: 650px;
            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255,255,255,0.075),
                    transparent 65%
                );

            filter: blur(20px);

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%);

            animation: breathing 7s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes breathing {
            0%, 100% {
                transform:
                    translate(-50%, -50%)
                    scale(0.9);
                opacity: 0.5;
            }

            50% {
                transform:
                    translate(-50%, -50%)
                    scale(1.15);
                opacity: 0.85;
            }
        }

        /* -------------------------
           GRID
        ------------------------- */

        .grid {
            position: fixed;
            inset: 0;

            background-image:
                linear-gradient(
                    var(--line) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    var(--line) 1px,
                    transparent 1px
                );

            background-size: 70px 70px;

            mask-image:
                radial-gradient(
                    circle at center,
                    black 0%,
                    transparent 75%
                );

            animation: gridMove 18s linear infinite;

            pointer-events: none;
        }

        @keyframes gridMove {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(70px);
            }
        }

        /* -------------------------
           NOISE
        ------------------------- */

        .noise {
            position: fixed;
            inset: -50%;

            opacity: 0.035;

            background-image:
                url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");

            animation: noiseMove .25s steps(2) infinite;

            pointer-events: none;
        }

        @keyframes noiseMove {
            0% {
                transform: translate(0,0);
            }

            25% {
                transform: translate(2%,-1%);
            }

            50% {
                transform: translate(-1%,2%);
            }

            75% {
                transform: translate(1%,1%);
            }

            100% {
                transform: translate(-2%,-2%);
            }
        }

        /* -------------------------
           MAIN
        ------------------------- */

        .page {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;
            z-index: 5;

            padding: 30px;
        }

        .content {
            width: min(850px, 92vw);
            text-align: center;
        }

        /* -------------------------
           TOP LABEL
        ------------------------- */

        .eyebrow {
            font-size: 11px;
            letter-spacing: 0.32em;
            text-transform: uppercase;

            color: #666;

            margin-bottom: 28px;

            opacity: 0;
            transform: translateY(15px);

            animation:
                fadeUp 1s ease forwards;

            animation-delay: .2s;
        }

        /* -------------------------
           NAME
        ------------------------- */

        .name {
            font-size: clamp(
                2.7rem,
                8vw,
                7rem
            );

            line-height: .9;

            font-weight: 600;

            letter-spacing: -0.065em;

            white-space: nowrap;

            opacity: 0;
            transform: translateY(35px);

            animation:
                fadeUp 1.2s
                cubic-bezier(.16,1,.3,1)
                forwards;

            animation-delay: .4s;
        }

        /* -------------------------
           DIVIDER
        ------------------------- */

        .divider {
            width: 0;
            height: 1px;

            background: rgba(255,255,255,.25);

            margin: 38px auto 30px;

            animation:
                expandLine 1.2s
                cubic-bezier(.16,1,.3,1)
                forwards;

            animation-delay: 1s;
        }

        @keyframes expandLine {
            to {
                width: 55px;
            }
        }

        /* -------------------------
           HEADLINE
        ------------------------- */

        .headline {
            font-size: clamp(
                1.4rem,
                3vw,
                2.2rem
            );

            font-weight: 400;

            letter-spacing: -0.025em;

            margin-bottom: 18px;

            opacity: 0;
            transform: translateY(20px);

            animation:
                fadeUp 1s
                cubic-bezier(.16,1,.3,1)
                forwards;

            animation-delay: 1.15s;
        }

        .description {
            max-width: 540px;

            margin: auto;

            color: #777;

            font-size: 15px;

            line-height: 1.8;

            opacity: 0;
            transform: translateY(20px);

            animation:
                fadeUp 1s
                cubic-bezier(.16,1,.3,1)
                forwards;

            animation-delay: 1.35s;
        }

        /* -------------------------
           STATUS
        ------------------------- */

        .status {
            display: inline-flex;

            align-items: center;

            gap: 11px;

            margin-top: 38px;

            padding: 11px 17px;

            border: 1px solid
                rgba(255,255,255,.1);

            border-radius: 100px;

            background:
                rgba(255,255,255,.025);

            color: #8a8a8a;

            font-size: 10px;

            letter-spacing: .16em;

            text-transform: uppercase;

            backdrop-filter: blur(10px);

            opacity: 0;

            animation:
                fadeIn 1s ease forwards;

            animation-delay: 1.8s;

            transition: .4s ease;
        }

        .status:hover {
            border-color:
                rgba(255,255,255,.25);

            background:
                rgba(255,255,255,.06);

            color: #aaa;

            transform: translateY(-2px);
        }

        .dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #d5d5d5;

            box-shadow:
                0 0 0 0
                rgba(255,255,255,.4);

            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow:
                    0 0 0 0
                    rgba(255,255,255,.35);
            }

            70% {
                box-shadow:
                    0 0 0 7px
                    rgba(255,255,255,0);
            }

            100% {
                box-shadow:
                    0 0 0 0
                    rgba(255,255,255,0);
            }
        }

        /* -------------------------
           FOOTER
        ------------------------- */

        .footer {
            position: fixed;

            bottom: 27px;
            left: 0;

            width: 100%;

            text-align: center;

            color: #3f3f3f;

            font-size: 10px;

            letter-spacing: .15em;

            z-index: 10;

            opacity: 0;

            animation:
                fadeIn 1s ease forwards;

            animation-delay: 2.2s;
        }

        /* -------------------------
           ANIMATIONS
        ------------------------- */

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        /* -------------------------
           MOBILE
        ------------------------- */

        @media (max-width: 600px) {

            .name {
                white-space: normal;

                font-size: 15vw;
            }

            .description {
                font-size: 14px;
            }

            .grid {
                background-size: 50px 50px;
            }

            .glow {
                width: 450px;
                height: 450px;
            }
        }

        /* Reduce animation for users who
           request reduced motion */
        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>

<body>

    <div class="glow"></div>

    <div class="grid"></div>

    <div class="noise"></div>


    <main class="page">

        <section class="content">

            <div class="eyebrow">
                Personal Portfolio · 2026
            </div>

            <h1 class="name">
                SANDHYA
            </h1>

            <div class="divider"></div>

            <h2 class="headline">
                Something new is taking shape.
            </h2>

            <p class="description">
                A personal space for ideas, work,
                creativity and the journey in between.
                The portfolio is currently being developed.
            </p>

            <div class="status">
                <span class="dot"></span>
                Currently building
            </div>

        </section>

    </main>


    <footer class="footer">
        SANDHYA-BHATTARAI.COM.NP
        <span id="year"></span>
    </footer>


    <script>

        // Dynamic year
        document.getElementById("year").textContent =
            " · " + new Date().getFullYear();


        // Very subtle cursor-based light movement
        const glow = document.querySelector(".glow");

        document.addEventListener("mousemove", (event) => {

            const x =
                (event.clientX / window.innerWidth - 0.5) * 30;

            const y =
                (event.clientY / window.innerHeight - 0.5) * 30;

            glow.style.marginLeft = `${x}px`;
            glow.style.marginTop = `${y}px`;

        });

    </script>

</body>
</html>
