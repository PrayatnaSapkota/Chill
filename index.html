<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sandhya Bhattarai — Coming Soon</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&family=Great+Vibes&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    height:100vh; overflow:hidden; display:flex; align-items:center; justify-content:center;
    background:#0b0618; font-family:'Poppins',sans-serif; color:#fff;
  }

  /* ---------- animated aurora background ---------- */
  .aurora { position:fixed; inset:0; z-index:0; overflow:hidden; }
  .blob { position:absolute; border-radius:50%; filter:blur(90px); opacity:.55; mix-blend-mode:screen; }
  .b1 { width:55vmax; height:55vmax; background:#ff2e88; top:-20vmax; left:-15vmax; animation:drift1 18s ease-in-out infinite alternate; }
  .b2 { width:45vmax; height:45vmax; background:#7b2eff; bottom:-18vmax; right:-12vmax; animation:drift2 22s ease-in-out infinite alternate; }
  .b3 { width:35vmax; height:35vmax; background:#00d4ff; top:40%; left:45%; animation:drift3 20s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform:translate(12vmax,10vmax) scale(1.2); } }
  @keyframes drift2 { to { transform:translate(-10vmax,-12vmax) scale(1.15); } }
  @keyframes drift3 { to { transform:translate(-14vmax,8vmax) scale(.85); } }

  /* ---------- floating stars ---------- */
  .star { position:absolute; width:3px; height:3px; border-radius:50%;
    background:#fff; animation:twinkle var(--d) ease-in-out infinite; }
  @keyframes twinkle { 0%,100%{opacity:.1; transform:scale(.6)} 50%{opacity:1; transform:scale(1.3)} }

  /* ---------- card ---------- */
  .card { position:relative; z-index:2; text-align:center; padding:30px; max-width:560px; }

  h1 { font-size:clamp(2rem,6vw,3rem); font-weight:800; letter-spacing:1px;
    background:linear-gradient(90deg,#ff2e88,#7b2eff,#00d4ff,#ff2e88);
    background-size:300% 100%; -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; animation:shine 5s linear infinite; }
  @keyframes shine { to { background-position:300% 0; } }

  .script { font-family:'Great Vibes',cursive; font-size:1.7rem; color:#ffb3d1; margin-top:4px; }

  /* ---------- glitch COMING SOON ---------- */
  .soon { margin:24px 0 10px; font-size:clamp(1.1rem,3.5vw,1.5rem); font-weight:600;
    letter-spacing:8px; color:#fff; position:relative; display:inline-block;
    animation:flicker 4s infinite; }
  .soon::before, .soon::after { content:attr(data-text); position:absolute; inset:0; }
  .soon::before { color:#00d4ff; animation:glitch1 3s infinite linear alternate; }
  .soon::after { color:#ff2e88; animation:glitch2 2.7s infinite linear alternate; }
  @keyframes glitch1 { 0%,92%,100%{transform:none; opacity:0}
    93%{transform:translate(-3px,2px); opacity:.8} 96%{transform:translate(3px,-1px); opacity:.8} }
  @keyframes glitch2 { 0%,90%,100%{transform:none; opacity:0}
    91%{transform:translate(3px,1px); opacity:.8} 95%{transform:translate(-2px,-2px); opacity:.8} }
  @keyframes flicker { 0%,100%{opacity:1} 96%{opacity:1} 97%{opacity:.4} 98%{opacity:1} }

  /* ---------- typewriter ---------- */
  .typer { min-height:1.8em; color:#b8c1d1; font-size:1rem; }
  .cursor { display:inline-block; width:2px; background:#ff2e88; animation:blink .8s step-end infinite; }
  @keyframes blink { 50%{opacity:0} }

  /* ---------- 🔨 NEW: brick-building construction animation ---------- */
  .build { margin-top:36px; position:relative; height:110px; }
  .wall { position:absolute; bottom:0; left:50%; transform:translateX(-50%);
    display:grid; grid-template-columns:repeat(3,44px); gap:5px; }
  .brick { width:44px; height:22px; border-radius:4px;
    background:linear-gradient(145deg,#ff5c9e,#c81e5e);
    box-shadow:0 3px 8px rgba(255,46,136,.4), inset 0 1px 0 rgba(255,255,255,.35);
    opacity:0; transform:translateY(-46px) rotate(-14deg) scale(.6);
    animation:drop .45s cubic-bezier(.34,1.56,.64,1) forwards; }
  .brick:nth-child(3n+2) { background:linear-gradient(145deg,#a06bff,#6a2bd8);
    box-shadow:0 3px 8px rgba(123,46,255,.4), inset 0 1px 0 rgba(255,255,255,.35); }
  .brick:nth-child(4) { background:linear-gradient(145deg,#4dd8ff,#0891c9);
    box-shadow:0 3px 8px rgba(0,212,255,.4), inset 0 1px 0 rgba(255,255,255,.35); }
  .b1x { animation-delay:.2s } .b2x { animation-delay:.9s } .b3x { animation-delay:1.6s }
  .b4x { animation-delay:2.3s } .b5x { animation-delay:3s }  .b6x { animation-delay:3.7s }
  @keyframes drop { to { opacity:1; transform:translateY(0) rotate(0) scale(1); } }
  .hammer { position:absolute; bottom:46px; left:calc(50% - 115px); font-size:2.1rem;
    transform-origin:70% 80%; animation:swing 1.15s ease-in-out infinite;
    filter:drop-shadow(0 0 10px rgba(255,255,255,.35)); }
  @keyframes swing { 0%,100%{transform:rotate(-28deg)} 50%{transform:rotate(34deg) translate(6px,4px)} }
  .spark { position:absolute; font-size:.9rem; opacity:0; animation:pop 2.3s ease-out infinite; }
  .s1 { left:calc(50% - 78px); bottom:56px; animation-delay:.55s; }
  .s2 { left:calc(50% - 40px); bottom:64px; animation-delay:1.25s; }
  .s3 { left:calc(50% - 5px);  bottom:60px; animation-delay:1.95s; }
  .s4 { left:calc(50% + 28px); bottom:56px; animation-delay:2.65s; }
  @keyframes pop { 0%{opacity:0; transform:scale(.3)} 12%{opacity:1; transform:scale(1.2)}
    30%{opacity:0; transform:scale(.6) translateY(-14px)} 100%{opacity:0} }
  .build-label { margin-top:16px; font-size:.72rem; letter-spacing:4px; color:#8b93a8;
    animation:softblink 2.4s ease-in-out infinite; }
  @keyframes softblink { 50%{opacity:.45} }

  /* ---------- buttons ---------- */
  .btns { margin-top:32px; display:flex; gap:16px; justify-content:center; flex-wrap:wrap; }
  .btn { display:inline-flex; align-items:center; gap:9px; padding:13px 26px;
    border-radius:50px; text-decoration:none; font-weight:600; font-size:.95rem;
    transition:transform .25s, box-shadow .25s; }
  .btn svg { width:20px; height:20px; }
  .btn-ig { background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);
    color:#fff; box-shadow:0 6px 25px rgba(220,39,67,.45); }
  .btn-mail { background:rgba(255,255,255,.08); color:#fff;
    border:1px solid rgba(255,255,255,.25); backdrop-filter:blur(6px); }
  .btn:hover { transform:translateY(-5px) scale(1.05); }
  .btn-ig:hover { box-shadow:0 12px 35px rgba(220,39,67,.65); }
  .btn-mail:hover { box-shadow:0 10px 30px rgba(255,255,255,.15); }

  .footer { margin-top:32px; font-size:.78rem; color:#6b7891; letter-spacing:1px; }
</style>

<script>
  // twinkling stars
  const aur = document.querySelector('.aurora');
  for (let i = 0; i < 70; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random()*100 + 'vw';
    s.style.top  = Math.random()*100 + 'vh';
    s.style.setProperty('--d', (1.5 + Math.random()*3) + 's');
    s.style.animationDelay = (Math.random()*3) + 's';
    const sz = Math.random()*2.5 + 1;
    s.style.width = s.style.height = sz + 'px';
    aur.appendChild(s);
  }

  // typewriter
  const phrases = [
    "🚧 My website is under construction...",
    "✨ Something amazing is Coming...",
    "🌸 Stay tuned, it's worth the wait!",
    "💌 Reach me on Instagram meanwhile..."
  ];
  const el = document.getElementById('typer');
  let pi = 0, ci = 0, deleting = false;
  function type() {
    const p = phrases[pi];
    el.textContent = p.slice(0, ci);
    if (!deleting && ci < p.length) { ci++; setTimeout(type, 55); }
    else if (!deleting) { deleting = true; setTimeout(type, 1800); }
    else if (ci > 0) { ci--; setTimeout(type, 25); }
    else { deleting = false; pi = (pi+1) % phrases.length; setTimeout(type, 400); }
  }
  type();
</script>
