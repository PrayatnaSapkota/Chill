<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<title>Sandhya Bhattarai — Coming Soon</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Manrope:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100svh;
    overflow: hidden;

    font-family: "DM Sans", sans-serif;
    color: #29242f;

    background:
        radial-gradient(
            circle at 50% 44%,
            rgba(211, 188, 255, 0.42) 0%,
            rgba(240, 220, 255, 0.23) 20%,
            transparent 43%
        ),
        radial-gradient(
            circle at 15% 15%,
            rgba(255, 201, 220, 0.40),
            transparent 35%
        ),
        radial-gradient(
            circle at 85% 85%,
            rgba(199, 216, 255, 0.32),
            transparent 38%
        ),
        #faf8fc;

    position: relative;
}


/* =========================================================
   SPACE BACKGROUND
========================================================= */

.space {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
}

.space::before {
    content: "";

    position: absolute;

    width: 58vw;
    height: 58vw;

    max-width: 750px;
    max-height: 750px;

    left: 50%;
    top: 47%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(177, 143, 235, 0.22) 0%,
            rgba(220, 182, 244, 0.12) 30%,
            transparent 70%
        );

    filter: blur(18px);

    animation: cosmicPulse 7s ease-in-out infinite;
}

@keyframes cosmicPulse {

    0%,
    100% {
        opacity: .55;
        transform: translate(-50%, -50%) scale(.94);
    }

    50% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.08);
    }
}


/* =========================================================
   STARS
========================================================= */

.stars,
.stars::before,
.stars::after {
    position: absolute;
    inset: 0;
    content: "";
    pointer-events: none;
}

.stars {

    background-image:
        radial-gradient(
            circle,
            rgba(100, 81, 130, .60) 1px,
            transparent 1.5px
        ),
        radial-gradient(
            circle,
            rgba(120, 94, 150, .38) 1px,
            transparent 1.5px
        ),
        radial-gradient(
            circle,
            rgba(255, 255, 255, .95) 1px,
            transparent 1.5px
        );

    background-size:
        150px 150px,
        230px 230px,
        310px 310px;

    background-position:
        20px 40px,
        90px 130px,
        40px 80px;

    opacity: .45;

    animation: starDrift 30s linear infinite;
}

.stars::before {

    background-image:
        radial-gradient(
            circle,
            rgba(104, 83, 130, .60) 1px,
            transparent 1.5px
        ),
        radial-gradient(
            circle,
            rgba(255,255,255,.80) 1px,
            transparent 1.5px
        );

    background-size:
        190px 190px,
        280px 280px;

    opacity: .30;

    animation: twinkle 5s ease-in-out infinite alternate;
}

@keyframes starDrift {

    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(-35px);
    }
}

@keyframes twinkle {

    from {
        opacity: .18;
    }

    to {
        opacity: .60;
    }
}


/* =========================================================
   SHOOTING STAR
========================================================= */

.shooting-star {

    position: absolute;

    width: 110px;
    height: 1px;

    top: 18%;
    left: -130px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(125, 100, 165, .15),
            rgba(125, 100, 165, .85)
        );

    transform: rotate(-32deg);

    opacity: 0;

    animation:
        shootingStar 9s linear infinite;
}

.shooting-star::after {

    content: "";

    position: absolute;

    right: 0;
    top: -2px;

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 10px rgba(150, 120, 200, .9),
        0 0 20px rgba(190, 150, 230, .45);
}

@keyframes shootingStar {

    0%,
    72% {
        transform: translate(0, 0) rotate(-32deg);
        opacity: 0;
    }

    76% {
        opacity: 1;
    }

    86% {
        transform:
            translate(115vw, 55vh)
            rotate(-32deg);

        opacity: 0;
    }

    100% {
        opacity: 0;
    }
}


/* =========================================================
   MAIN
========================================================= */

main {

    position: relative;
    z-index: 5;

    min-height: 100svh;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    padding:
        40px 24px
        max(40px, env(safe-area-inset-bottom));
}

.content {

    width: min(900px, 100%);

    display: flex;
    flex-direction: column;
    align-items: center;
}


/* =========================================================
   NAME
========================================================= */

.name-wrap {

    position: relative;

    margin-bottom: 22px;

    padding: 5px 12px;

    overflow: visible;
}

.name {

    position: relative;

    font-family: "Manrope", sans-serif;

    font-size:
        clamp(2rem, 5vw, 4.2rem);

    font-weight: 600;

    letter-spacing: -0.045em;

    line-height: 1.1;

    color: #463951;

    /*
       Animated cosmic gradient inside text
    */

    background:
        linear-gradient(
            110deg,
            #47375a 0%,
            #8e62b3 18%,
            #d28cb0 35%,
            #9c78d1 50%,
            #6c86c9 65%,
            #c985b0 80%,
            #47375a 100%
        );

    background-size: 300% 100%;
    background-position: 0% 50%;

    -webkit-background-clip: text;
    background-clip: text;

    -webkit-text-fill-color: transparent;
    color: transparent;

    opacity: 0;

    transform: translateY(22px);

    animation:
        nameReveal
        1.2s
        cubic-bezier(.16,1,.3,1)
        .25s
        forwards,

        nameGradient
        5.5s
        ease-in-out
        1.6s
        infinite,

        nameGlow
        4.5s
        ease-in-out
        2s
        infinite;
}

@keyframes nameReveal {

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes nameGradient {

    0% {
        background-position: 0% 50%;
    }

    25% {
        background-position: 45% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    75% {
        background-position: 55% 50%;
    }

    100% {
        background-position: 0% 50%;
    }
}

@keyframes nameGlow {

    0%,
    100% {
        filter:
            drop-shadow(
                0 0 0
                rgba(170, 130, 215, 0)
            );
    }

    50% {
        filter:
            drop-shadow(
                0 0 15px
                rgba(171, 126, 218, .30)
            );
    }
}


/* Bright light sweep across name */

.name-wrap::after {

    content: "";

    position: absolute;

    top: 0;
    bottom: 0;

    width: 80px;

    left: -100px;

    transform: skewX(-18deg);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.65),
            transparent
        );

    filter: blur(8px);

    pointer-events: none;

    animation:
        nameSweep
        5.5s
        ease-in-out
        2.2s
        infinite;
}

@keyframes nameSweep {

    0%,
    30% {
        left: -100px;
        opacity: 0;
    }

    40% {
        opacity: .8;
    }

    58% {
        left: calc(100% + 40px);
        opacity: 0;
    }

    100% {
        left: calc(100% + 40px);
        opacity: 0;
    }
}


/* =========================================================
   ORBIT
========================================================= */

.orbit {

    position: absolute;

    width: min(520px, 72vw);

    aspect-ratio: 2 / 1;

    border:
        1px solid
        rgba(135, 110, 165, .17);

    border-radius: 50%;

    transform: rotate(-18deg);

    pointer-events: none;

    opacity: 0;

    animation:
        orbitAppear
        1.4s
        ease
        1.5s
        forwards,

        orbitRotate
        20s
        linear
        2s
        infinite;
}

.orbit::before,
.orbit::after {

    content: "";

    position: absolute;

    width: 7px;
    height: 7px;

    top: 50%;

    transform: translateY(-50%);

    border-radius: 50%;
}

.orbit::before {

    left: -3px;

    background: #b18ad5;

    box-shadow:
        0 0 14px
        rgba(177, 138, 213, .8);
}

.orbit::after {

    right: -3px;

    background: #d99dbd;

    box-shadow:
        0 0 14px
        rgba(217, 157, 189, .7);
}

@keyframes orbitAppear {

    from {
        opacity: 0;
        transform:
            rotate(-18deg)
            scale(.9);
    }

    to {
        opacity: 1;
        transform:
            rotate(-18deg)
            scale(1);
    }
}

@keyframes orbitRotate {

    from {
        transform: rotate(-18deg);
    }

    to {
        transform: rotate(342deg);
    }
}


/* =========================================================
   COMING SOON
========================================================= */

.coming {

    position: relative;

    font-family: "Manrope", sans-serif;

    font-size:
        clamp(2.6rem, 8vw, 6.8rem);

    line-height: .95;

    font-weight: 700;

    letter-spacing: -.065em;

    color: #201a28;

    opacity: 0;

    transform:
        scale(.94)
        translateY(15px);

    animation:
        comingReveal
        1.4s
        cubic-bezier(.16,1,.3,1)
        .65s
        forwards;
}

.coming::before {

    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 125%;
    height: 180%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse,
            rgba(178, 143, 224, .19),
            rgba(210, 180, 240, .08) 38%,
            transparent 70%
        );

    filter: blur(13px);

    z-index: -1;

    animation:
        comingGlow
        4s
        ease-in-out
        infinite;
}

@keyframes comingReveal {

    0% {

        opacity: 0;

        transform:
            scale(.94)
            translateY(15px);

        letter-spacing: -.09em;
    }

    100% {

        opacity: 1;

        transform:
            scale(1)
            translateY(0);

        letter-spacing: -.065em;
    }
}

@keyframes comingGlow {

    0%,
    100% {

        opacity: .55;

        transform:
            translate(-50%, -50%)
            scale(.92);
    }

    50% {

        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1.08);
    }
}


/* =========================================================
   DESCRIPTION
========================================================= */

.description {

    margin-top: 25px;

    font-size:
        clamp(.92rem, 2vw, 1.05rem);

    font-weight: 400;

    color: #756d7d;

    letter-spacing: .01em;

    opacity: 0;

    transform: translateY(12px);

    animation:
        fadeUp
        .9s
        ease
        1.35s
        forwards;
}


/* =========================================================
   SOCIAL BUTTONS
========================================================= */

.links {

    display: flex;

    gap: 12px;

    margin-top: 32px;

    opacity: 0;

    transform: translateY(12px);

    animation:
        fadeUp
        .9s
        ease
        1.6s
        forwards;
}

.link {

    display: inline-flex;

    align-items: center;
    justify-content: center;

    gap: 9px;

    min-width: 130px;
    min-height: 46px;

    padding: 11px 20px;

    border-radius: 999px;

    text-decoration: none;

    font-size: .88rem;
    font-weight: 500;

    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

    transition:
        transform .3s ease,
        background .3s ease,
        border-color .3s ease,
        box-shadow .3s ease;
}


/* =========================================================
   INSTAGRAM
========================================================= */

.link.instagram {

    color: #a34b82;

    background:
        linear-gradient(
            135deg,
            rgba(255, 205, 226, .52),
            rgba(221, 190, 255, .45)
        );

    border:
        1px solid
        rgba(190, 105, 157, .26);
}

.link.instagram:hover {

    color: #8e356d;

    background:
        linear-gradient(
            135deg,
            rgba(255, 190, 218, .72),
            rgba(210, 174, 250, .65)
        );

    border-color:
        rgba(183, 86, 143, .40);

    box-shadow:
        0 10px 30px
        rgba(190, 105, 157, .18);

    transform: translateY(-3px);
}


/* =========================================================
   EMAIL
========================================================= */

.link.email {

    color: #5576a8;

    background:
        linear-gradient(
            135deg,
            rgba(204, 222, 255, .54),
            rgba(224, 210, 255, .45)
        );

    border:
        1px solid
        rgba(100, 130, 190, .25);
}

.link.email:hover {

    color: #426496;

    background:
        linear-gradient(
            135deg,
            rgba(190, 216, 255, .72),
            rgba(215, 198, 255, .65)
        );

    border-color:
        rgba(82, 119, 180, .40);

    box-shadow:
        0 10px 30px
        rgba(92, 125, 185, .17);

    transform: translateY(-3px);
}


/* =========================================================
   ICONS
========================================================= */

.link svg {

    width: 17px;
    height: 17px;

    flex-shrink: 0;
}

.instagram-icon {

    fill: currentColor;
    stroke: none;
}

.email-icon {

    fill: none;
    stroke: currentColor;
}


/* Keyboard focus */

.link:focus-visible {

    outline:
        2px solid
        rgba(130, 95, 175, .55);

    outline-offset: 4px;
}


/* =========================================================
   FADE ANIMATION
========================================================= */

@keyframes fadeUp {

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    main {

        padding-left: 18px;
        padding-right: 18px;
    }

    .name-wrap {

        margin-bottom: 18px;

        padding:
            4px 8px;
    }

    .name {

        font-size:
            clamp(
                1.85rem,
                8.8vw,
                3.2rem
            );
    }

    .coming {

        font-size:
            clamp(
                2.5rem,
                13vw,
                4.2rem
            );
    }

    .description {

        max-width: 300px;

        line-height: 1.5;
    }

    .orbit {

        width: 92vw;
    }

    .links {

        width: 100%;

        max-width: 310px;

        gap: 9px;
    }

    .link {

        flex: 1;

        min-width: 0;

        padding:
            10px 15px;
    }
}


/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media (max-width: 380px) {

    .name {

        font-size:
            1.7rem;
    }

    .coming {

        font-size:
            2.35rem;
    }

    .description {

        font-size:
            .84rem;
    }

    .links {

        margin-top: 26px;
    }

    .link {

        min-height: 44px;

        padding:
            9px 12px;

        font-size:
            .80rem;
    }

    .link svg {

        width: 16px;
        height: 16px;
    }

    .orbit {

        width: 105vw;
    }
}


/* =========================================================
   SHORT SCREENS
========================================================= */

@media (max-height: 700px) {

    main {

        padding-top: 25px;
        padding-bottom: 25px;
    }

    .name-wrap {

        margin-bottom: 13px;
    }

    .description {

        margin-top: 17px;
    }

    .links {

        margin-top: 22px;
    }

    .orbit {

        width:
            min(430px, 72vw);
    }
}


/* =========================================================
   LANDSCAPE PHONES
========================================================= */

@media (orientation: landscape) and (max-height: 500px) {

    body {
        overflow-y: auto;
    }

    main {

        min-height: 100svh;

        padding-top: 35px;
        padding-bottom: 35px;
    }

    .name {

        font-size: 2rem;
    }

    .coming {

        font-size: 3.3rem;
    }

    .description {

        margin-top: 13px;
    }

    .links {

        margin-top: 18px;
    }

    .orbit {

        width: 360px;
    }
}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {

        animation-duration:
            .01ms !important;

        animation-iteration-count:
            1 !important;

        scroll-behavior:
            auto !important;
    }
}

</style>
</head>


<body>

     SPACE BACKGROUND
======================================================= -->

<div class="space">

    <div class="stars"></div>

    <div class="shooting-star"></div>

</div>

</main>


</body>
</html>
